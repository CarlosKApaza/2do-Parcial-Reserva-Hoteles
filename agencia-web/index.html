<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cliente Web - Agencia Online</title>
</head>

<body>
    <div id="seccion-login">
        <h3>1. Iniciar Sesión</h3>
        <div class="form-group">
            <label>Email de la Agencia</label>
            <input type="email" id="email" value="agencia@turismo.com">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" value="123456">
        </div>
        <button onclick="iniciarSesion()">Obtener Token JWT</button>
        <div id="msg-login" class="alert"></div>
    </div>

    <div id="seccion-reserva" style="display: none; margin-top: 30px; border-top: 2px solid #eee; padding-top: 20px;">
        <h3>2. Panel de Reservas</h3>
        <div class="form-group">
            <label>Fecha de Reserva</label>
            <input type="date" id="fecha" value="2026-05-30">
        </div>
        <div class="form-group">
            <label>CI del Huésped</label>
            <input type="text" id="idHuesped" value="1234567">
        </div>
        <div class="form-group">
            <label>Hotel Destino</label>
            <select id="hotelDestino">
                <option value="Gran Sucre">Hotel Gran Sucre (REST)</option>
                <option value="Mirador Andino">Hotel Mirador Andino (GraphQL)</option>
            </select>
        </div>
        <div class="form-group">
            <label>Código de Habitación</label>
            <input type="text" id="codHabitacion" placeholder="Ej: 101 o 201">
        </div>
        <div class="form-group">
            <label>Noches</label>
            <input type="number" id="noches" value="3">
        </div>
        <button onclick="hacerReserva()" style="background-color: #28a745;">Confirmar Reserva</button>
        <div id="msg-reserva" class="alert"></div>
    </div>
    </div>

    <script>
        // Variable global para guardar el token
        let tokenJWT = "";

        async function iniciarSesion() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const msgBox = document.getElementById('msg-login');

            try {
                const respuesta = await fetch('http://127.0.0.1:8000/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    tokenJWT = datos.token; // Guardamos el token
                    msgBox.className = "alert success";
                    msgBox.innerText = "Conectado - Token recibido.";
                    msgBox.style.display = "block";

                    document.getElementById('seccion-login').style.display = "none";
                    document.getElementById('seccion-reserva').style.display = "block";
                } else {
                    msgBox.className = "alert error";
                    msgBox.innerText = datos.mensaje || "Error al iniciar sesión.";
                    msgBox.style.display = "block";
                }
            } catch (error) {
                msgBox.className = "alert error";
                msgBox.innerText = "Error de conexión con el Motor de Reservas.";
                msgBox.style.display = "block";
            }
        }

        async function hacerReserva() {
            const msgBox = document.getElementById('msg-reserva');
            msgBox.style.display = "none"; // Resetear mensaje

            const payload = {
                fecha: document.getElementById('fecha').value,
                idHuesped: document.getElementById('idHuesped').value,
                codHabitacion: document.getElementById('codHabitacion').value,
                hotelDestino: document.getElementById('hotelDestino').value,
                noches: document.getElementById('noches').value
            };

            try {
                const respuesta = await fetch('http://127.0.0.1:8000/api/reserva', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + tokenJWT // enviamos el token
                    },
                    body: JSON.stringify(payload)
                });

                const datos = await respuesta.json();

                if (respuesta.ok) {
                    msgBox.className = "alert success";
                    msgBox.innerText = datos.mensaje + "\nConsulta tu BD para verificar.";
                    msgBox.style.display = "block";
                } else {
                    msgBox.className = "alert error";
                    msgBox.innerText = datos.error || "Error al reservar.";
                    msgBox.style.display = "block";
                }
            } catch (error) {
                msgBox.className = "alert error";
                msgBox.innerText = "Error de conexión con el Motor de Reservas.";
                msgBox.style.display = "block";
            }
        }
    </script>

</body>

</html>
